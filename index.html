<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おとのしゃしん（スペクトログラム印刷）</title>
<style>
  :root {
    --accent: #e8560f;
    --ink: #222;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
    background: #faf6ef;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px 40px;
  }
  h1 {
    font-size: 26px;
    margin: 8px 0 2px;
  }
  h1 .sub { font-size: 15px; color: #777; font-weight: normal; margin-left: 10px; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 14px 0;
  }
  button {
    font-family: inherit;
    font-size: 20px;
    padding: 12px 26px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: #ddd;
    transition: transform .05s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: .4; cursor: default; }
  #recBtn { background: var(--accent); color: #fff; font-size: 24px; }
  #recBtn.recording { background: #b00; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .6; } }
  #printBtn { background: #1668c8; color: #fff; }
  #playBtn { background: #2e9e44; color: #fff; }
  .fields {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    margin: 10px 0;
  }
  .fields label { font-size: 16px; }
  .fields input[type=text] {
    font-family: inherit;
    font-size: 20px;
    padding: 6px 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    width: 220px;
  }
  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    font-size: 14px;
    color: #555;
    margin: 6px 0 12px;
  }
  .settings label { display: flex; align-items: center; gap: 5px; }
  #status {
    font-size: 16px;
    min-height: 24px;
    color: #a33;
    margin: 4px 0;
  }
  #timer { font-size: 20px; font-variant-numeric: tabular-nums; color: #333; }
  canvas { display: block; }
  #liveCanvas {
    width: 100%;
    height: 90px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  #specCanvas {
    width: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 10px;
  }
  .hint { font-size: 13px; color: #888; margin-top: 16px; line-height: 1.7; }

  /* ---------- 印刷（ハガキシール） ---------- */
  #printSheet { display: none; }
  @media print {
    body { background: #fff; }
    .app { display: none !important; }
    #printSheet {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      padding: 4mm 5mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #printSheet img {
      width: 100%;
      flex: 1;
      object-fit: contain;
      min-height: 0;
    }
    #printCaption {
      font-size: 13pt;
      text-align: center;
      padding-top: 1.5mm;
      white-space: nowrap;
      overflow: hidden;
    }
    #printCaption .word { font-weight: bold; font-size: 15pt; }
    #printCaption .meta { font-size: 10pt; color: #333; margin-left: 4mm; }
  }
</style>
<style id="pageStyle">@page { size: 148mm 100mm; margin: 0; }</style>
</head>
<body>
<div class="app">
  <h1>🎤 おとのしゃしん <span class="sub">こえを ろくおんして スペクトログラムを いんさつしよう（広帯域・上限8000Hz）</span></h1>

  <div class="toolbar">
    <button id="recBtn">● ろくおん</button>
    <button id="playBtn" disabled>▶ きく</button>
    <button id="printBtn" disabled>🖨 いんさつ</button>
    <span id="timer"></span>
  </div>
  <div id="status"></div>

  <div class="fields">
    <label>いったことば <input type="text" id="wordInput" placeholder="あいうえお"></label>
    <label>なまえ <input type="text" id="nameInput" placeholder=""></label>
  </div>

  <canvas id="liveCanvas"></canvas>
  <canvas id="specCanvas"></canvas>

  <div class="settings">
    <label><input type="radio" name="band" value="wide" checked> 広帯域（5&nbsp;ms）</label>
    <label><input type="radio" name="band" value="narrow"> 狭帯域（30&nbsp;ms）</label>
    <label>ダイナミックレンジ <input type="range" id="dynRange" min="30" max="90" value="70" step="5"> <span id="dynVal">70</span> dB</label>
    <label><input type="checkbox" id="trimSilence" checked> 前後の無音をカット</label>
    <label>用紙の向き
      <select id="orient">
        <option value="landscape" selected>ハガキ よこ（148×100）</option>
        <option value="portrait">ハガキ たて（100×148）</option>
      </select>
    </label>
  </div>

  <div class="hint">
    つかいかた：「ろくおん」→ はなす（さいだい5秒）→「とめる」→「いんさつ」。<br>
    印刷ダイアログで用紙サイズ「はがき」・ふちなし（または余白最小）を選んでください。設定はプリンタ側に記憶されるので2回目からはワンクリックです。<br>
    このファイルをダブルクリックで開くだけで動きます（初回のみマイク許可が必要）。
  </div>
</div>

<!-- 印刷専用レイアウト -->
<div id="printSheet">
  <img id="printImg" alt="">
  <div id="printCaption"><span class="word" id="capWord"></span><span class="meta" id="capMeta"></span></div>
</div>

<script>
"use strict";
const MAX_SEC = 5;
const MAX_FREQ = 8000;

const $ = id => document.getElementById(id);
const recBtn = $("recBtn"), playBtn = $("playBtn"), printBtn = $("printBtn");
const statusEl = $("status"), timerEl = $("timer");
const liveCanvas = $("liveCanvas"), specCanvas = $("specCanvas");

let audioCtx = null, mediaStream = null, procNode = null, srcNode = null;
let recording = false;
let chunks = [], recSampleRate = 48000;
let samples = null;          // 録音済み Float32Array
let playSource = null;

/* ---------------- 録音 ---------------- */
async function startRecording() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    statusEl.textContent = "マイクを使えませんでした：" + e.message;
    return;
  }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  recSampleRate = audioCtx.sampleRate;
  srcNode = audioCtx.createMediaStreamSource(mediaStream);
  procNode = audioCtx.createScriptProcessor(4096, 1, 1);
  chunks = [];
  procNode.onaudioprocess = ev => {
    if (!recording) return;
    chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    const sec = chunks.length * 4096 / recSampleRate;
    timerEl.textContent = sec.toFixed(1) + " 秒";
    drawLive(chunks[chunks.length - 1]);
    if (sec >= MAX_SEC) stopRecording();
  };
  srcNode.connect(procNode);
  procNode.connect(audioCtx.destination); // Chromeでは接続しないと動かない
  recording = true;
  recBtn.textContent = "■ とめる";
  recBtn.classList.add("recording");
  playBtn.disabled = printBtn.disabled = true;
  statusEl.textContent = "ろくおんちゅう… マイクにむかって はなしてね！";
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  try { procNode.disconnect(); srcNode.disconnect(); } catch (e) {}
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  recBtn.textContent = "● ろくおん";
  recBtn.classList.remove("recording");
  statusEl.textContent = "";

  let total = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new Float32Array(total);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  samples = $("trimSilence").checked ? trim(buf, recSampleRate) : buf;
  if (samples.length < recSampleRate * 0.15) {
    statusEl.textContent = "みじかすぎたみたい。もういちど ろくおんしてね。";
    samples = null;
    return;
  }
  playBtn.disabled = printBtn.disabled = false;
  renderSpectrogram();
}

function trim(x, fs) {
  let peak = 0;
  for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  const th = peak * 0.03;
  let s = 0, e = x.length - 1;
  while (s < x.length && Math.abs(x[s]) < th) s++;
  while (e > s && Math.abs(x[e]) < th) e--;
  const pad = Math.round(fs * 0.08);
  s = Math.max(0, s - pad);
  e = Math.min(x.length, e + pad);
  return x.slice(s, e);
}

recBtn.addEventListener("click", () => recording ? stopRecording() : startRecording());

/* ---------------- 再生 ---------------- */
playBtn.addEventListener("click", () => {
  if (!samples) return;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  if (playSource) { try { playSource.stop(); } catch (e) {} }
  const b = audioCtx.createBuffer(1, samples.length, recSampleRate);
  b.getChannelData(0).set(samples);
  playSource = audioCtx.createBufferSource();
  playSource.buffer = b;
  playSource.connect(audioCtx.destination);
  playSource.start();
});

/* ---------------- ライブ波形 ---------------- */
function drawLive(block) {
  const c = liveCanvas, ctx = c.getContext("2d");
  if (c.width !== c.clientWidth * 2) { c.width = c.clientWidth * 2; c.height = c.clientHeight * 2; }
  const W = c.width, H = c.height;
  ctx.drawImage(c, -8, 0);            // 左へスクロール
  ctx.fillStyle = "#fff";
  ctx.fillRect(W - 8, 0, 8, H);
  let mn = 1, mx = -1;
  for (let i = 0; i < block.length; i++) { mn = Math.min(mn, block[i]); mx = Math.max(mx, block[i]); }
  ctx.fillStyle = "#e8560f";
  const y1 = H / 2 - mx * H / 2, y2 = H / 2 - mn * H / 2;
  ctx.fillRect(W - 8, y1, 8, Math.max(2, y2 - y1));
}

/* ---------------- FFT ---------------- */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

/* ---------------- スペクトログラム描画 ---------------- */
function renderSpectrogram() {
  if (!samples) return;
  const fs = recSampleRate;
  const winSec = document.querySelector('input[name=band]:checked').value === "wide" ? 0.005 : 0.03;
  const dyn = +$("dynRange").value;
  const dur = samples.length / fs;

  // ガウス窓（実効長 winSec、物理長はその2倍）
  const L = Math.min(1 << 15, Math.max(32, Math.round(winSec * fs * 2)));
  let nfft = 1;
  while (nfft < L) nfft <<= 1;
  nfft <<= 1;                                   // ゼロ詰めで周波数を滑らかに
  const win = new Float32Array(L);
  const c0 = (L - 1) / 2, sig = L / 6;
  for (let i = 0; i < L; i++) win[i] = Math.exp(-0.5 * ((i - c0) / sig) ** 2);

  const cols = Math.min(1400, Math.max(300, Math.round(dur * 400)));
  const hop = samples.length / cols;
  const nBins = Math.min(nfft / 2, Math.ceil(MAX_FREQ / fs * nfft));

  const re = new Float32Array(nfft), im = new Float32Array(nfft);
  const spec = new Float32Array(cols * nBins);
  let maxDb = -Infinity;
  for (let col = 0; col < cols; col++) {
    re.fill(0); im.fill(0);
    const center = Math.round(col * hop + hop / 2);
    const start = center - (L >> 1);
    for (let i = 0; i < L; i++) {
      const idx = start + i;
      re[i] = (idx >= 0 && idx < samples.length) ? samples[idx] * win[i] : 0;
    }
    fft(re, im);
    for (let b = 0; b < nBins; b++) {
      const p = re[b] * re[b] + im[b] * im[b];
      const db = 10 * Math.log10(p + 1e-12);
      spec[col * nBins + b] = db;
      if (db > maxDb) maxDb = db;
    }
  }

  // 生画像（cols × nBins）
  const off = document.createElement("canvas");
  off.width = cols; off.height = nBins;
  const octx = off.getContext("2d");
  const imgData = octx.createImageData(cols, nBins);
  const floor = maxDb - dyn;
  for (let col = 0; col < cols; col++) {
    for (let b = 0; b < nBins; b++) {
      let v = (spec[col * nBins + b] - floor) / dyn;
      v = v < 0 ? 0 : v > 1 ? 1 : v;
      const g = Math.round(255 * (1 - v));            // 濃い＝強い（Praat風）
      const y = nBins - 1 - b;                        // 低い周波数を下に
      const p = (y * cols + col) * 4;
      imgData.data[p] = imgData.data[p + 1] = imgData.data[p + 2] = g;
      imgData.data[p + 3] = 255;
    }
  }
  octx.putImageData(imgData, 0, 0);

  // 軸つきの本キャンバス（印刷にも使うので高解像度）
  const W = 1760, waveH = 200, specH = 900;
  const mL = 110, mR = 20, mT = 16, mB = 90, gap = 14;
  const H = mT + waveH + gap + specH + mB;
  specCanvas.width = W; specCanvas.height = H;
  specCanvas.style.aspectRatio = W + "/" + H;
  const ctx = specCanvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  const plotW = W - mL - mR;

  // 波形
  ctx.save();
  ctx.translate(mL, mT);
  ctx.strokeStyle = "#e0e0e0";
  ctx.strokeRect(0, 0, plotW, waveH);
  ctx.fillStyle = "#1668c8";
  let wPeak = 0;
  for (let i = 0; i < samples.length; i++) wPeak = Math.max(wPeak, Math.abs(samples[i]));
  const norm = wPeak > 0 ? 0.95 / wPeak : 1;
  for (let px = 0; px < plotW; px++) {
    const i0 = Math.floor(px / plotW * samples.length);
    const i1 = Math.floor((px + 1) / plotW * samples.length);
    let mn = 1, mx = -1;
    for (let i = i0; i < i1; i++) { const v = samples[i] * norm; if (v < mn) mn = v; if (v > mx) mx = v; }
    if (mn > mx) { mn = 0; mx = 0; }
    const y1 = waveH / 2 - mx * waveH / 2, y2 = waveH / 2 - mn * waveH / 2;
    ctx.fillRect(px, y1, 1, Math.max(1, y2 - y1));
  }
  ctx.restore();

  // スペクトログラム本体
  const specTop = mT + waveH + gap;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, mL, specTop, plotW, specH);
  ctx.strokeStyle = "#888";
  ctx.strokeRect(mL, specTop, plotW, specH);

  // 周波数軸（1 kHzごと）
  ctx.fillStyle = "#222";
  ctx.font = "32px sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let f = 0; f <= MAX_FREQ; f += 1000) {
    const y = specTop + specH - f / MAX_FREQ * specH;
    ctx.fillText((f / 1000).toFixed(0), mL - 14, y);
    ctx.strokeStyle = "#888";
    ctx.beginPath(); ctx.moveTo(mL - 8, y); ctx.lineTo(mL, y); ctx.stroke();
  }
  ctx.save();
  ctx.translate(34, specTop + specH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.fillText("kHz", 0, 0);
  ctx.restore();

  // 時間軸
  const tickStep = dur > 2.5 ? 0.5 : dur > 1 ? 0.2 : 0.1;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let t = 0; t <= dur + 1e-6; t += tickStep) {
    const x = mL + t / dur * plotW;
    if (x > W - mR + 1) break;
    ctx.fillText(t.toFixed(1), x, specTop + specH + 16);
    ctx.beginPath(); ctx.moveTo(x, specTop + specH); ctx.lineTo(x, specTop + specH + 8); ctx.stroke();
  }
  ctx.fillText("びょう（秒）", mL + plotW / 2, specTop + specH + 54);

  updatePrintSheet();
}

/* ---------------- 印刷 ---------------- */
function updatePrintSheet() {
  if (!samples) return;
  $("printImg").src = specCanvas.toDataURL("image/png");
  const word = $("wordInput").value.trim();
  const name = $("nameInput").value.trim();
  const d = new Date();
  const dateStr = d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
  $("capWord").textContent = word ? "「" + word + "」" : "";
  $("capMeta").textContent = (name ? name + "　" : "") + dateStr;
}

printBtn.addEventListener("click", () => {
  updatePrintSheet();
  window.print();
});

$("orient").addEventListener("change", () => {
  $("pageStyle").textContent = $("orient").value === "landscape"
    ? "@page { size: 148mm 100mm; margin: 0; }"
    : "@page { size: 100mm 148mm; margin: 0; }";
});

["dynRange", "trimSilence"].forEach(id => $(id).addEventListener("input", () => {
  $("dynVal").textContent = $("dynRange").value;
  renderSpectrogram();
}));
document.querySelectorAll('input[name=band]').forEach(el =>
  el.addEventListener("change", renderSpectrogram));
["wordInput", "nameInput"].forEach(id => $(id).addEventListener("input", updatePrintSheet));

/* ---------------- 動作確認用テスト信号（コンソールから window.loadTestSignal()） ---------------- */
window.loadTestSignal = function () {
  const fs = 48000, dur = 2.0, N = Math.round(fs * dur);
  const x = new Float32Array(N);
  const formants = [[700, 1200, 2500], [300, 2300, 3000], [400, 800, 2600]]; // あ・い・お風
  for (let seg = 0; seg < 3; seg++) {
    const s0 = Math.round(seg * N / 3), s1 = Math.round((seg + 1) * N / 3);
    const F = formants[seg];
    for (let i = s0; i < s1; i++) {
      const t = i / fs;
      const f0 = 130 + 20 * Math.sin(2 * Math.PI * 2 * t);   // 声の高さゆらぎ
      let v = 0;
      for (let h = 1; h <= 40; h++) {
        const fh = f0 * h;
        if (fh > 8000) break;
        let amp = 1 / h;
        for (const Ff of F) amp += 1.2 * Math.exp(-((fh - Ff) ** 2) / (2 * 200 ** 2));
        v += amp / h * Math.sin(2 * Math.PI * fh * t);
      }
      const env = Math.min(1, (i - s0) / (fs * 0.03), (s1 - i) / (fs * 0.03));
      x[i] = v * 0.05 * Math.max(0, env);
    }
  }
  recSampleRate = fs;
  samples = x;
  playBtn.disabled = printBtn.disabled = false;
  renderSpectrogram();
};
</script>
</body>
</html>
